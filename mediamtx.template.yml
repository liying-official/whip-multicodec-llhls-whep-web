logLevel: info
readTimeout: 30s
writeTimeout: 30s

# 每次启动随机生成 OBS 发布密码；磁盘中只保存 SHA-256 哈希。
authMethod: internal
authInternalUsers:
  - user: obs
    pass: "__PUBLISH_PASS_HASH__"
    # Password and source IP must both match. This is an application-level
    # fail-closed boundary even if an upstream firewall is misconfigured.
    ips: __PUBLISH_IPS__
    permissions:
      - action: publish
        path: live

  # 网页/HLS/WebRTC 匿名观看。
  - user: any
    pass:
    ips: []
    permissions:
      - action: read
        path: live

  # 仅 loopback 可读取 MediaMTX metrics；监听地址也固定在 loopback。
  - user: any
    pass:
    ips: ["127.0.0.1", "::1"]
    permissions:
      - action: metrics

# OBS -> MediaMTX: WHIP / WebRTC
# 视频原样通过：H.264 / H.265(HEVC) / AV1 / VP9；音频通常为 Opus。
webrtc: true
# WHIP 信令只绑定指定的 RFC1918 网卡 IPv4，不监听公网/其他网卡。
webrtcAddress: "__INGEST_IP__:8889"
webrtcEncryption: false
webrtcAllowOrigins: []
# Public WHEP requests reach MediaMTX only through the loopback Gateway. Trust it
# so X-Forwarded-For can preserve the real viewer IP for loopback-only metrics.
webrtcTrustedProxies: ["127.0.0.1", "::1"]
webrtcLocalUDPAddress: :8189
# TCP media fallback helps software encoders and WHEP viewers on networks that block UDP.
webrtcLocalTCPAddress: :8189
# Do not advertise every server interface (including unrelated IPv6/VPN/link-local
# addresses). Explicitly advertise only the LAN ingest IPv4 plus the mandatory
# PUBLIC_HOST A-only DNS name. DDNS can update its A record when public IPv4 changes. Public WHEP also filters non-IPv4 candidates.
# This makes candidate selection deterministic across Windows Chromium/Edge.
webrtcIPsFromInterfaces: false
webrtcAdditionalHosts: __WEBRTC_ADDITIONAL_HOSTS__
# The upstream default is 2s. 4K software x264/SVT-AV1 can take longer to emit
# the first RTP frame, which otherwise makes MediaMTX close a valid WHIP session.
webrtcTrackGatherTimeout: 15s

# MediaMTX -> 本机统一 8080 网关：Low-Latency HLS。
# 8888 仅监听 loopback，不对局域网/公网暴露。
hls: true
hlsAddress: 127.0.0.1:8888
hlsEncryption: false
hlsAllowOrigins: []
hlsAlwaysRemux: true
hlsVariant: lowLatency

# 服务器保留 24 个约 2s 媒体段；每段内按 1s CMAF part 低延迟发布，
# 为弱网短时断流恢复保留更大的追赶窗口。
hlsSegmentCount: 24
# Use one-second CMAF parts inside two-second segments. Shorter fractional
# targets can round 24 fps parts to different durations, which MediaMTX warns
# can break iOS LL-HLS clients. One second is an exact integer frame interval
# for all common integer OBS frame rates while keeping parts available before
# the two-second segment closes.
hlsSegmentDuration: 2s
hlsPartDuration: 1s
hlsSegmentMaxSize: 50M
hlsDirectory: ""
hlsMuxerCloseAfter: 60s

# 本方案不需要的服务。
rtsp: false
# Compatibility ingest for encoders that use frame reordering or cannot emit
# their first WebRTC frame quickly enough. MediaMTX recommends RTMP for OBS.
rtmp: true
rtmpEncryption: "no"
rtmpAddress: "__INGEST_IP__:1935"
srt: false
moq: false
api: false
metrics: true
metricsAddress: 127.0.0.1:9998
metricsEncryption: false
metricsAllowOrigins: []
pprof: false
playback: false

paths:
  live:
    source: publisher
    record: false
