<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <title>Live</title>
  <link rel="stylesheet" href="/app.css">
  <script src="/hls.min.js" defer></script>
  <script src="/app.js" defer></script>
</head>
<body>
  <video id="video" controls playsinline autoplay muted></video>
  <div id="modebar" aria-label="播放模式">
    <button id="soundToggle" type="button" aria-pressed="false">开启声音</button>
    <button id="autoMode" type="button">自动</button>
    <button id="hlsMode" type="button">LL-HLS</button>
    <button id="whepMode" type="button">WebRTC / AV1</button>
  </div>
  <div id="status" role="status" aria-live="polite"></div>
</body>
</html>
